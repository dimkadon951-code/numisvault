name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сгенерировать нативную оболочку Android
        run: flutter create --project-name numisvault --org com.numisvault --platforms=android .

      - name: Вернуть файлы проекта, если create их перезаписал
        run: git checkout -- .

      - name: Разрешение INTERNET для release-сборки
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: numisvault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сгенерировать нативную оболочку Windows
        run: flutter create --project-name numisvault --org com.numisvault --platforms=windows .

      - name: Вернуть файлы проекта, если create их перезаписал
        run: git checkout -- .

      - run: flutter pub get

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: numisvault-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
